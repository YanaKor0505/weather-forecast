<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
  </head>
  <body>
    <div class="card">
      <h1 class="card__title">Weather App</h1>
      <p class="card__date">Today, <span id="date"></span></p>
      <div class="card__search">
        <input class="card__input" type="text" placeholder="Enter city name" />
        <button class="card__btn" id="searchBtn">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>
      <div class="card__weather">
        <h2 class="card__title card__title--city" id="city">New York</h2>
        <div class="card__block">
          <h3 class="card__title card__title--temp">22°C</h3>
          <img class="card__weather-icon" src="" alt="Icon" />
        </div>
      </div>
      <div class="card__details">
        <div class="card__col">
          <i class="fa-solid fa-wind"></i>
          <p>Wind</p>
          <p class="card__info" id="wind">15 m/s</p>
        </div>
        <div class="card__col">
          <i class="fa-solid fa-droplet"></i>
          <p>Hum</p>
          <p class="card__info" id="humidity">50 %</p>
        </div>
      </div>
    </div>

    <script src="script.js" type="module"></script>
  </body>
</html>
